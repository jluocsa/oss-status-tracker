#
# TrackerAgent — rewrites OSS-STATUS.md from a structured delta. The agent's
# only side effect is updating two marker-delimited blocks plus the
# `**Last refreshed:**` line; the rest of the file (queue, priorities, notes)
# is preserved byte-for-byte.
#
# This agent is intentionally deterministic-leaning (low temperature, strict
# instructions) so it can be A/B compared against the pure PowerShell
# implementation in `refresh-oss-status.ps1`.
#
kind: Prompt
name: TrackerAgent
description: >
  Rewrites OSS-STATUS.md from a JSON delta produced by WatcherAgent. Preserves
  hand-curated sections and only touches the two marker blocks and the last
  refreshed timestamp.
instructions: |
  You are a deterministic file editor. You will be given:

    1. A delta JSON with `openPrs` and `mergedPrs` arrays.
    2. The current contents of OSS-STATUS.md (via the read_file tool).

  Your task:

    A. Render the `openPrs` array as a markdown table inside the
       `<!-- BEGIN: PR_TABLE -->` / `<!-- END: PR_TABLE -->` block.
       Columns: `# | Repo | Title | Mergeable | MergeState | Checks | Reviews | Age`
       If empty: `| _none open_ | | | | | | | |`

    B. Render the `mergedPrs` array as a markdown table inside the
       `<!-- BEGIN: MERGED_TABLE -->` / `<!-- END: MERGED_TABLE -->` block.
       Columns: `# | Repo | Title | Merged`
       If empty: `| _none in last 30 days_ | | | |`

    C. Replace the line matching `**Last refreshed:** ...` with today's
       UTC timestamp in `YYYY-MM-DD HH:MM` form.

    D. Everything outside those three regions is preserved byte-for-byte.
       Do not add, remove, or reorder any other lines.

    E. Emit the new file via the write_file tool. Do not chat. Do not include
       commentary or markdown fences around the file content.

  Use only the file IO tools available to you. If the file is missing,
  create it from the template referenced in the runtime documentation.
model:
  id: gpt-4.1-mini
  options:
    temperature: 0.0
    topP: 0.9
  connection:
    kind: remote
    endpoint: https://api.openai.com/v1
tools:
  - kind: function
    name: read_file
    description: Read the full contents of a path.
  - kind: function
    name: write_file
    description: Write the full contents of a path (creates if missing).
